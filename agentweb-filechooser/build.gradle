apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdk COMPILE_SDK_VERSION.toInteger()

    defaultConfig {
        minSdkVersion 14
        namespace 'com.just.agentweb.filechooser'
        targetSdkVersion TARGET_SDK_VERSION.toInteger()
        versionCode 2
        versionName VERSION_NAME

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // agentweb-core 按字符串名反射调用本模块，随包下发 keep 规则保住反射链路。
        consumerProguardFiles 'consumer-rules.pro'

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions{
        abortOnError false
    }
    // AGP 7.1+ 必须显式声明要发布的变体，否则不会生成 components.release 软件组件，
    // publishing 里也就无从挂载 AAR。
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    testImplementation 'junit:junit:4.12'
    compileOnly 'com.google.android.material:material:1.0.0'
    compileOnly 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation project(':agentweb-core')
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            // 此前这里缺少 from components.release，publish 只产出一个空壳 POM 而没有 AAR。
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Justson.AgentWeb'
                artifactId = 'agentweb-filechooser'
                version = 'v5.1.5-androidx'
            }
        }
    }
}