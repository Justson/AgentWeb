apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdk COMPILE_SDK_VERSION.toInteger()


    defaultConfig {
        minSdkVersion 14
        targetSdkVersion TARGET_SDK_VERSION.toInteger()
        namespace 'com.just.agentweb'
        versionCode 3
        versionName VERSION_NAME
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Issue #1072: ship Proguard/R8 rules so consumer apps do not have to
        // re-declare the @JavascriptInterface keep rule themselves.
        consumerProguardFiles 'consumer-rules.pro'

    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    repositories {
        flatDir {
            dirs 'libs', 'providedLibs'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // AGP 7.1+ 必须显式声明要发布的变体，否则不会生成 components.release 软件组件，
    // publishing 里也就无从挂载 AAR。
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
//   defaultPublishConfig "debug"
}

dependencies {
    compileOnly fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    testImplementation 'junit:junit:4.12'
    compileOnly 'com.github.Justson:Downloader:v5.0.6-androidx'
    compileOnly 'com.google.android.material:material:1.0.0'
    compileOnly 'androidx.legacy:legacy-support-v4:1.0.0'
    compileOnly fileTree(include: ['*.jar'], dir: 'providedLibs')
}

// 必须放在 afterEvaluate 中：components.release 由 AGP 在工程求值完成后才创建。
// 此前这里缺少 from components.release，publish 只产出一个空壳 POM 而没有 AAR。
afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Justson.AgentWeb'
                artifactId = 'agentweb-core'
                version = 'v5.1.6-androidx'
            }
        }
    }
}